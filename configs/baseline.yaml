# Baseline configuration — ConvNeXt-Small + BiLSTM
# Phase 3: Image classification model v1

backbone: convnext_small
aggregator: bilstm
in_channels: 3          # 2.5D: 3 adjacent slices as channels
num_slices: 24          # slices per series (interpolated)
num_classes: 12

# Training
epochs: 15
batch_size: 16
lr: 1.0e-4
weight_decay: 0.01
warmup_ratio: 0.1
dropout: 0.3

# Loss
loss: asymmetric         # "asymmetric" or "masked_bce"
gamma_neg: 4.0
gamma_pos: 1.0
clip: 0.05
label_smoothing: 0.05    # used if loss=masked_bce

# Data
num_workers: 2
target_size: [224, 224]
clip_percentiles: [0.5, 99.5]

# Augmentation
hflip_prob: 0.5          # label-aware (swaps medial↔lateral)
brightness_jitter: 0.1
contrast_jitter: 0.1
